# Multi-turn evaluation set for the Northline Studio SMS assistant.
#
# Each entry scripts a FIXED prior conversation and then asks one final question. The
# history is written out rather than generated live, so a run is deterministic and cheap,
# and a failure points at the final answer rather than at some earlier turn.
#
# `direction` matches src/history.py: in = customer, out = the bot.
# Fields otherwise mirror eval/golden.yaml. Validate with: python3 eval/audit_golden.py

# ------------------------------------------------- followup (5): the question only makes
# sense given the conversation. These are what query rewriting has to fix.

- id: m01
  category: followup
  history:
    - {direction: in,  body: "how much is a drop in class"}
    - {direction: out, body: "A single drop-in class is $28, bookable without a membership."}
    - {direction: in,  body: "what about the 10 pack"}
    - {direction: out, body: "A 10-class pack is $230."}
  question: "and how long do i have to use it"
  expect: answerable
  sources:
    - pricing.md#drop-in-and-class-packs
  reference_answer: "A 10-class pack expires six months after purchase."
  must_include:
    - "six months"
  evidence:
    - "A 10-class pack is $230 and expires six months after purchase."

- id: m02
  category: followup
  history:
    - {direction: in,  body: "whats on saturday morning"}
    - {direction: out, body: "Saturday starts with Power Yoga at 7:30 AM, then Vinyasa Flow at 9:00 AM."}
  question: "who teaches the first one"
  expect: answerable
  sources:
    - schedule.md#weekly-class-schedule
  reference_answer: "The 7:30 AM Power Yoga on Saturday is taught by Kai Reyes."
  must_include:
    - "Kai Reyes"
  evidence:
    - "| Sat | 7:30 AM  | Power Yoga        | Kai Reyes        | 3 | 75 |"

- id: m03
  category: followup
  history:
    - {direction: in,  body: "tell me about the 49 dollar thing"}
    - {direction: out, body: "The intro offer is $49 for two weeks of unlimited classes."}
  question: "can i pause it if i get sick"
  expect: answerable
  sources:
    - intro-offer.md#terms-and-restrictions
  reference_answer: "No, intro-offer clients cannot freeze the two-week window except with a documented medical exception."
  must_include:
    - "documented medical exception"
  evidence:
    - "Intro-offer clients cannot freeze or pause the two-week window for any reason other than a documented medical exception."

- id: m04
  category: followup
  history:
    - {direction: in,  body: "what memberships do u have"}
    - {direction: out, body: "There are three monthly memberships: Essential, Plus and Unlimited."}
  question: "whats the cheapest one"
  expect: answerable
  sources:
    - pricing.md#membership-tiers
  reference_answer: "Essential is the cheapest at $89 per month, and it includes 8 classes a month."
  must_include:
    - "$89"
  evidence:
    - "Essential is $89 per month and includes 8 classes per month."

- id: m05
  category: followup
  history:
    - {direction: in,  body: "im booked into barre on thursday"}
    - {direction: out, body: "Grip socks are required for Barre Basics, and you will not be allowed to participate without them."}
  question: "how much are they"
  expect: answerable
  sources:
    - what-to-bring.md#grip-socks
  reference_answer: "Grip socks are $18 at the front desk, in standard adult sizes."
  must_include:
    - "$18"
  evidence:
    - "Grip socks are sold at the front desk for $18 in standard adult sizes."

# ------------------------------------------------- topic_change (3): a self-contained
# question that happens to follow an unrelated conversation. The earlier topic must not
# drag retrieval off course.

- id: m06
  category: topic_change
  history:
    - {direction: in,  body: "how much is a drop in class"}
    - {direction: out, body: "A single drop-in class is $28, bookable without a membership."}
    - {direction: in,  body: "what about the 10 pack"}
    - {direction: out, body: "A 10-class pack is $230 and expires six months after purchase."}
  question: "do you have parking"
  expect: answerable
  sources:
    - logistics.md#parking
  reference_answer: "Yes, there is a free lot behind the building with 14 spaces, first-come-first-served."
  must_include:
    - "14 spaces"
  evidence:
    - "Northline Studio has a free lot behind the building with 14 spaces, available first-come-first-served and entered from the alley off Bell Street."

- id: m07
