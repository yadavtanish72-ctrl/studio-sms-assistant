  category: false_history
  history:
    - {direction: in,  body: "whats the earliest class saturday"}
    - {direction: out, body: "On Saturday the first class of the day is Vinyasa Flow at 9:00 AM."}
  question: "so 9am is the earliest i can get in on a saturday"
