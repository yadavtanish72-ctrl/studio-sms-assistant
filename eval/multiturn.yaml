  question: "whats ur address"
  expect: answerable
  sources:
    - logistics.md#getting-in-and-arrival
  reference_answer: "Northline Studio is at 1420 Northline Avenue."
  must_include:
    - "1420 Northline Avenue"
  evidence:
    - "Northline Studio is at 1420 Northline Avenue."

- id: m08
  category: topic_change
  history:
    - {direction: in,  body: "whats the cancellation policy"}
    - {direction: out, body: "Northline requires at least 12 hours notice to cancel a booked class."}
  question: "do i need to bring my own mat"
  expect: answerable
