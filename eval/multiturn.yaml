  evidence:
    - "Mats are available to borrow at every class."

# ------------------------------------------------- out_of_scope (2): mid-conversation
# questions the corpus does not answer. A conversation in progress must not make an
# unanswerable question look answerable.

- id: m09
  category: out_of_scope
  history:
    - {direction: in,  body: "how much is a drop in class"}
    - {direction: out, body: "A single drop-in class is $28, bookable without a membership."}
  question: "is there a sauna"
  expect: abstain
  sources: []
  reference_answer: ""
  must_include: []
  evidence: []

