# ------------------------------------------------- false_claim (2): the CUSTOMER asserts
# something the corpus contradicts. The bot must correct it from CONTEXT rather than going
# along with it to be agreeable.

- id: m11
  category: false_claim
  history:
    - {direction: in,  body: "how much for one class"}
    - {direction: out, body: "A single drop-in class at Northline Studio is $28, bookable without a membership."}
  question: "wait i thought u said it was 15"
  expect: answerable
  sources:
    - pricing.md#drop-in-and-class-packs
  reference_answer: "A single drop-in class is $28, not $15."
  must_include:
    - "$28"
  evidence:
    - "A single drop-in class at Northline Studio is $28, bookable without a membership."

- id: m14
  category: false_claim
  history:
    - {direction: in,  body: "thinking of booking friday"}
    - {direction: out, body: "Friday has Sunrise Flow at 6:00 AM, Strength Circuit at 12:10 PM and Power Yoga at 5:30 PM."}
  question: "and if i dont show up thats free right, i read that somewhere"
  expect: answerable
  sources:
    - policies.md#no-shows
  reference_answer: "No, a no-show carries a $15 fee charged to the card on file, and you also lose the class credit or allotment."
  must_include:
    - "$15"
  evidence:
    - "In addition, every no-show carries a $15 fee charged to the card on file."

# ------------------------------------------------- false_history (2): the BOT's own
# earlier reply contains something the corpus contradicts. History is context, never
# evidence, so a wrong fact must not survive just because it appears earlier in the thread.

- id: m12
  category: false_history
  history:
    - {direction: in,  body: "hows the intro offer work"}
    - {direction: out, body: "The intro offer is $49 for four weeks of unlimited classes, starting the day you buy it."}
  question: "so four weeks from the day i pay yeah"
  expect: answerable
  sources:
    - intro-offer.md#what-you-get
  reference_answer: "It is two weeks, not four, and the window starts on the date of your first booked class rather than the date you purchase it."
  must_include:
    - "two weeks"
    - "not the date you purchase it"
  evidence:
    - "The Northline intro offer is $49 for two weeks of unlimited classes."
    - "The two-week window starts on the date of your first booked class, not the date you purchase it, so buying early does not shorten the offer."

