# Golden evaluation set for the Northline Studio SMS QA system.
# Questions are in customer-SMS register and deliberately avoid the source documents'
# vocabulary. `evidence` is a list of verbatim quotes, one per source.
# `must_include` values are literal substrings of content/ — matched case-insensitively
# against the answer, so facts are graded on presence, not phrasing.
# Validate with: python3 eval/audit_golden.py

